name: gst_bill_app
description: Mobile client for the GST bill reconciliation pipeline.
publish_to: "none"
version: 1.0.0+2002

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  share_plus: ^11.0.0
  path_provider: ^2.1.4
  record: ^7.0.0
  # PDF bills (DAS-27). `file_picker` because image_picker cannot select a
  # document; `pdfx` renders pages through the platform's own engine
  # (Android PdfRenderer / iOS PDFKit) rather than shipping one.
  file_picker: ^8.1.2
  pdfx: ^2.6.0
  package_info_plus: ^9.0.1
  pdf: ^3.13.1
  qr: ^3.0.2   # already here through pdf; draws the stock page QR on the phone
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  patrol: 4.10.0   # exact: must pair with the global patrol_cli (4.8.0), see tool/e2e

flutter:
  uses-material-design: true
  # The sale bill PDF's font (DAS-121): Noto Sans, SIL Open Font License.
  # The PDF's built-in fonts have no rupee sign.
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

# End-to-end tests on the Android emulator (DAS-109): `tool/e2e/run.sh`.
# Patrol runs the Dart tests in integration_test/ as Android instrumentation
# and drives the native camera app for the photograph step.
patrol:
  app_name: Dastavez
  test_directory: integration_test
  screenshot_on_failure: true   # Android: the screen at the failing step, beside the per-step shots
  android:
    package_name: com.dastavez.bahi
  ios:
    bundle_id: com.dastavez.bahi
